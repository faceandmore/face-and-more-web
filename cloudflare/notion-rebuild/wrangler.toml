name = "faceandmore-notion-rebuild"
main = "src/index.js"

# ACHTUNG: Die Werte unten stammen NICHT aus dem veroeffentlichten Worker (Cloudflare-Dashboard),
# sondern sind fuer lokale Tests gesetzt. Vor jedem Deploy mit dem Dashboard abgleichen
# (Settings -> Runtime -> Compatibility date, Settings -> Domains & Routes), damit ein
# Deploy aus dem Repo weder das Laufzeitverhalten noch die Erreichbarkeit aendert.
compatibility_date = "2026-01-01"

# Secrets (NOTION_VERIFICATION_TOKEN, DEPLOY_HOOK_URL) stehen NICHT hier, sondern nur als
# Worker-Secrets im Dashboard bzw. lokal in .dev.vars (nicht eingecheckt).

# Cron-Trigger: alle 6 Stunden (00:00, 06:00, 12:00, 18:00 UTC) den Deploy-Hook aufrufen.
# ABSICHTLICH AUSKOMMENTIERT, damit nichts aktiv wird, bevor der geaenderte Worker deployt und
# geprueft ist (siehe README, Abschnitt "Cron aktivieren").
# [triggers]
# crons = ["0 */6 * * *"]
